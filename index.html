<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Loan Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <h1>Loan Calculator</h1>
    <p class="subtitle">Estimate your monthly EMI instantly</p>

    <div class="input-group">
      <label for="amount">Loan Amount (₹)</label>
      <input type="number" id="amount" value="500000" min="1" />
    </div>

    <div class="input-group">
      <label for="rate">Annual Interest Rate (%)</label>
      <input type="number" id="rate" value="8.5" step="0.1" min="0" />
    </div>

    <div class="input-group">
      <label for="years">Loan Tenure (Years)</label>
      <input type="number" id="years" value="5" min="1" />
    </div>

    <button id="calc-btn">Calculate EMI</button>

    <div class="results" id="results">
      <div class="result-item">
        <span>Monthly EMI</span>
        <strong id="emi-output">₹0.00</strong>
      </div>
      <div class="result-item">
        <span>Total Interest</span>
        <strong id="interest-output">₹0.00</strong>
      </div>
      <div class="result-item">
        <span>Total Payment</span>
        <strong id="total-output">₹0.00</strong>
      </div>
    </div>
  </div>

  <script src="calculator.js"></script>
</body>
</html>
